name: Nexus
version: "1.0"

llm:
  provider: ollama
  model: llama3.2  # alternative tested: qwen2.5:7b (same eval score, larger)
  embed_model: nomic-embed-text
  base_url: http://localhost:11434
  temperature: 0.3
  max_tokens: 4096

brain:
  data_dir: data
  memory_db: data/memory.db
  storage: postgres
  postgres:
    host: localhost
    port: 5432
    database: nexus_brain
    user: postgres
    password: postgres
  max_context_memories: 8
  proactive_interval_seconds: 30
  max_agent_iterations: 30
  max_parse_retries: 5
  stuck_action_threshold: 3
  wind_down_at_iteration: 24
  learn_from_every_task: true
  memory_tiers:
    enabled: true
    consolidate_every_n_episodes: 5
    max_facts_in_context: 5
    max_procedures_in_context: 3
    max_episodes_in_context: 4
  job_queue:
    lease_seconds: 300       # claim expires; concurrent runners reclaim stale leases
    heartbeat_seconds: 60    # mid-run renewals; must stay under lease_seconds
    max_attempts: 4
    retry_base_seconds: 30
    retry_backoff: 2.0
    # ReAct checkpoint rolling compaction (multi-reclaim context safety)
    # keep_recent_in_transcript=8, max_stored_steps=24 — see core/react_checkpoint.py

portfolio:
  engine_root: C:\Users\cheki\Desktop\New folder (2)\portfolio-growth-engine
  project: nexus-brain

paths:
  workspace: C:\Users\cheki\nexus-brain
  inbox: data/inbox
  agents_dir: data/spawned_agents
  logs_dir: data/logs

proactive:
  enabled: true
  watch_inbox: true
  scan_on_start: true
  retry:
    max_attempts: 4          # total runs before data/inbox/failed/
    base_delay_seconds: 30   # 30s → 60s → 120s → …
    backoff_multiplier: 2

# Tool execution sandbox — confinement + shell policy + per-runner rate limits
tool_policy:
  enabled: true
  # Empty allowed_roots → workspace + portfolio.engine_root
  allowed_roots:
    - C:\Users\cheki\nexus-brain
    - C:\Users\cheki\Desktop\New folder (2)\portfolio-growth-engine
  shell:
    mode: blocklist          # blocklist | allowlist (blocklist fits flexible agent shell use)
    # Additional patterns (defaults already block Format-Volume, iex downloads, etc.)
    blocklist: []
    allowlist: []            # used only when mode: allowlist
  rate_limits:
    window_seconds: 60
    max_tool_calls: 120      # per runner id (host:pid)
    max_llm_calls: 40        # LLM burst cap per runner / window
  # Strip host API keys/tokens from env inherited by shell/code runners
  env_scrub:
    enabled: true
    deny: []                 # extra env names to always strip (case-insensitive)
    allow: []                # escape hatch: keep these even if they look sensitive
